<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <meta name="theme-color" content="#16264d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BrightRise Academy | Online Math, Science, English & Coding Classes</title>
    <meta name="description" content="BrightRise Academy offers live one-on-one online classes in Math, Science, English, and Coding for students from Kindergarten through Grade 10 worldwide." />
    <link rel="canonical" href="https://www.brightriseacademy.com/" />

    <!-- Open Graph / social sharing baseline. Individual routes override
         these at runtime via src/components/Seo.jsx; these static tags are
         the fallback seen by crawlers/bots that don't execute JavaScript. -->
    <meta property="og:site_name" content="BrightRise Academy" />
    <meta property="og:title" content="BrightRise Academy | Online Math, Science, English & Coding Classes" />
    <meta property="og:description" content="BrightRise Academy offers live one-on-one online classes in Math, Science, English, and Coding for students from Kindergarten through Grade 10 worldwide." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.brightriseacademy.com/" />
    <meta property="og:image" content="https://www.brightriseacademy.com/logo-full.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrightRise Academy | Online Math, Science, English & Coding Classes" />
    <meta name="twitter:description" content="BrightRise Academy offers live one-on-one online classes in Math, Science, English, and Coding for students from Kindergarten through Grade 10 worldwide." />
    <meta name="twitter:image" content="https://www.brightriseacademy.com/logo-full.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Site-wide structured data: present even without JavaScript. Route-
         specific structured data (breadcrumbs, FAQPage, Course) is added at
         runtime by src/components/Seo.jsx. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "BrightRise Academy",
        "url": "https://www.brightriseacademy.com",
        "logo": "https://www.brightriseacademy.com/logo-icon.png",
        "description": "BrightRise Academy offers live one-on-one online classes in Math, Science, English, and Coding for students from Kindergarten through Grade 10 worldwide."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BrightRise Academy",
        "url": "https://www.brightriseacademy.com"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
